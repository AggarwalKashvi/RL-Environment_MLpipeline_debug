[project]
name = "mlpipeline-debug-env"
version = "0.1.0"
description = "OpenEnv ML pipeline debugging environment"
authors = [
    { name = "Kashvi Aggarwal" },
    { name = "Riya Gupta"}
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pydantic==1.10.17",
    "openai==1.35.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "api.app:main"

[tool.setuptools.packages.find]
where = ["."]